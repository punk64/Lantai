<div id="boot">
  <div class="boot-card">
    <svg class="mark" viewBox="0 0 512 512"><use href="#logo-full"/></svg>
    <h1>兰台</h1>
    <div class="en" data-i18n="brand.tagline">个人书库 · 阅读与归档</div>
    <div id="bootBody"></div>
  </div>
</div>

<div id="app" style="display:none">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 512 512"><use href="#logo-full"/></svg>
      <div class="brand-txt"><b>兰台</b><span th:text="${version}">0.1.0</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="pulse"><i class="dot" id="dServer"></i><span id="svText">25600 · 运行中</span></div>
      <div class="pulse"><i class="dot idle" id="dSwy"></i><span id="swyText">在线源服务未启动</span></div>
      <div class="side-tools">
        <button class="btn ghost sm" id="aboutBtn" title="关于" data-i18n-title="nav.about"><svg class="ic"><use href="#i-info"/></svg><span class="lb" data-i18n="nav.about">关于</span></button>
        <button class="btn ghost sm" id="notifyBtn" title="通知" data-i18n-title="nav.notify"><svg class="ic"><use href="#i-bell"/></svg><span class="lb" data-i18n="nav.notify">通知</span><i class="ndot" id="notifyDot" style="display:none"></i></button>
      </div>
      <button class="btn ghost sm blk" id="collapseBtn"><svg class="ic"><use href="#i-left"/></svg><span class="lb">收起导航</span></button>
    </div>
  </aside>
  <section class="main">
    <header class="topbar">
      <button class="icon-btn" id="mobNav" title="导航" data-i18n-title="top.nav"><svg><use href="#i-list"/></svg></button>
      <div class="gsearch">
        <span class="s-ic"><svg width="16" height="16"><use href="#i-search"/></svg></span>
        <input id="gInput" placeholder="搜索系列、书籍、合集、在线源…" data-i18n-ph="top.search" autocomplete="off">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="top-right">
        <div id="liveReading"></div>
        <button class="icon-btn" id="taskBtn" title="任务队列" data-i18n-title="top.tasks"><svg><use href="#i-bolt"/></svg></button>
        <button class="icon-btn" id="notifyTop" title="通知" data-i18n-title="nav.notify"><svg><use href="#i-bell"/></svg><i class="ndot" id="notifyDotTop" style="display:none"></i></button>
        <button class="icon-btn" id="themeBtn" title="切换主题" data-i18n-title="top.theme"><svg><use href="#i-sun"/></svg></button>
        <div class="userchip" id="userChip">
          <span class="avatar" id="uAvatar"></span>
          <div><div class="u-n" id="uName"></div><div class="u-r" id="uRole"></div></div>
        </div>
      </div>
    </header>
    <div class="page" id="view"></div>
  </section>
</div>

<div class="veil" id="veil"></div>
<div class="modal" id="modal"><div class="modal-h"><h3 id="mTitle"></h3><div class="r" id="mHead"></div></div>
  <div class="modal-b" id="mBody"></div><div class="modal-f" id="mFoot"></div></div>
<div class="drawer" id="drawer"><div class="drawer-h"><h3 id="dTitle"></h3><div class="r" style="margin-left:auto" id="dHead"></div></div>
  <div class="drawer-b" id="dBody"></div></div>

<div id="toasts"></div>
<div id="palette"><div class="pal"><input id="palInput" placeholder="跳转页面、打开书籍、执行操作…"><div class="pal-list" id="palList"></div></div></div>
