application.version: TESTING

lantai:
  database:
    file: "\${java.io.tmpdir}/database\${random.uuid}.sqlite"
    journal-mode: WAL
  tasks-db:
    file: "\${java.io.tmpdir}/tasks\${random.uuid}.sqlite"
    journal-mode: WAL
  sessions-db:
    file: "\${java.io.tmpdir}/sessions\${random.uuid}.sqlite"
    journal-mode: WAL
  jdbc-session-enabled: true

spring:
  flyway:
    enabled: true

logging:
  level:
    org.lantai: DEBUG
#    org.jooq: DEBUG
#    org.jooq.tools.LoggerListener: DEBUG
